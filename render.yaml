services:
  - type: web
    name: pathforge
    env: node
    plan: free
    buildCommand: npm run install-all
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
        placeholder: "Your MongoDB Connection URI (e.g. mongodb+srv://...)"
      - key: JWT_SECRET
        generateValue: true
