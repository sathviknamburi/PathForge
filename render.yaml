services:
  - type: web
    name: pathforge
    env: node
    plan: free
    buildCommand: NODE_ENV=development npm run install-all && NODE_ENV=development npm run build:frontend
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
        placeholder: "Your MongoDB Connection URI (e.g. mongodb+srv://...)"
      - key: JWT_SECRET
        generateValue: true
